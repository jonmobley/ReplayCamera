name: Replay
options:
  bundleIdPrefix: com.moxie
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: "1.3.0"
targets:
  Replay:
    type: application
    platform: iOS
    sources:
      - path: Replay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moxie.Replay
        INFOPLIST_FILE: Replay/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: Replay/Info.plist
      properties:
        CFBundleDisplayName: Replay
        CFBundleName: Replay
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Replay records video when you tap the shutter so you can save the moment.
        NSMicrophoneUsageDescription: Replay includes microphone audio in the clips you save.
        NSPhotoLibraryAddUsageDescription: Replay saves your clips to the Replay album in Photos.
        NSPhotoLibraryUsageDescription: Replay shows your Replay album and Moments library. With iCloud Photos on, saves sync automatically.
  ReplayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReplayTests
    dependencies:
      - target: Replay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moxie.ReplayTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Replay:
    build:
      targets:
        Replay: all
        ReplayTests: [test]
    test:
      targets:
        - ReplayTests
