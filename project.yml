name: Replay
options:
  bundleIdPrefix: com.moxie
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
targets:
  Replay:
    type: application
    platform: iOS
    sources:
      - path: Replay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moxie.Replay
        INFOPLIST_FILE: Replay/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: Replay/Info.plist
      properties:
        CFBundleDisplayName: Replay
        CFBundleName: Replay
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Replay continuously buffers recent video so you can save the moment after it happens.
        NSMicrophoneUsageDescription: Replay includes microphone audio in the buffered clip you save.
        NSPhotoLibraryAddUsageDescription: Replay saves your clip to the Replay album in Photos.
        NSPhotoLibraryUsageDescription: Replay shows your Replay album and saves new clips there. With iCloud Photos on, they sync automatically.
